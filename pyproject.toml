[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iridium-music-bot"
version = "0.1.0"
description = "Iridium, a private Telegram interface for Apple Music tracks"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.20,<4", "gamdl>=3.9,<4", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
cookie-export = ["playwright>=1.64,<2"]

[project.scripts]
iridium-bot = "iridium_bot.main:main"
music-bot = "music_bot:main"
apple-music-cookie-export = "cookie_export:main"

[tool.setuptools]
py-modules = ["music_bot", "cookie_export"]
packages = ["iridium_bot"]
